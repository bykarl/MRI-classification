[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-mri-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
description = "Traceable MRI pilot features and participant-grouped validation"
dependencies = ["numpy==1.26.4", "scipy==1.14.1", "scikit-learn==1.5.2", "PyYAML==6.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
